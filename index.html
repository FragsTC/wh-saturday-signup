<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Window Hero — Saturday Work Sign-Up</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #002366;
    --navy-mid: #003080;
    --navy-light: #174090;
    --gold: #EDAA00;
    --gold-light: #F5C030;
    --gold-pale: #FFF8E1;
    --cream: #f7f8fc;
    --white: #ffffff;
    --text-dark: #001a4d;
    --text-mid: #3a4a6b;
    --text-light: #7a8aaa;
    --success-bg: #fffae6;
    --success-border: #EDAA00;
    --success-text: #7a4f00;
    --border: #dde3f0;
    --radius: 10px;
    --shadow: 0 2px 12px rgba(0,35,102,0.08);
    --shadow-lg: 0 8px 32px rgba(0,35,102,0.16);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: var(--cream); color: var(--text-dark); min-height: 100vh; }

  .header { background: var(--navy); padding: 28px 40px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px; }
  .header-left { display: flex; align-items: center; gap: 16px; }
  .logo-mark { width: 44px; height: 44px; background: var(--gold); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 600; color: var(--navy); flex-shrink: 0; }
  .header-titles { display: flex; flex-direction: column; gap: 2px; }
  .header-titles .brand { font-size: 18px; font-weight: 600; color: var(--white); }
  .header-titles .sub { font-size: 13px; color: #7a93b0; }
  .header-controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .year-nav { display: flex; align-items: center; background: var(--navy-mid); border-radius: 8px; overflow: hidden; border: 1px solid var(--navy-light); }
  .year-btn { background: none; border: none; cursor: pointer; color: var(--gold-light); font-size: 16px; padding: 8px 14px; transition: background 0.15s; }
  .year-btn:hover { background: var(--navy-light); }
  .year-display { font-family: 'DM Mono', monospace; font-size: 16px; font-weight: 500; color: var(--white); padding: 8px 16px; border-left: 1px solid var(--navy-light); border-right: 1px solid var(--navy-light); min-width: 68px; text-align: center; }
  .icon-btn { background: transparent; border: 1px solid var(--navy-light); cursor: pointer; color: #a0b4cc; font-size: 13px; font-weight: 500; padding: 9px 16px; border-radius: 8px; font-family: 'DM Sans', sans-serif; transition: background 0.15s, color 0.15s; display: flex; align-items: center; gap: 6px; }
  .icon-btn:hover { background: var(--navy-mid); color: var(--white); }
  .icon-btn svg { transition: transform 0.5s; }
  .icon-btn.spinning svg { transform: rotate(360deg); }

  .status-bar { background: var(--navy-mid); padding: 8px 40px; display: flex; align-items: center; gap: 8px; font-size: 12px; color: #7a93b0; }
  .status-dot { width: 7px; height: 7px; border-radius: 50%; background: #7a93b0; flex-shrink: 0; transition: background 0.3s; }
  .status-dot.live { background: #4ade80; box-shadow: 0 0 6px rgba(74,222,128,0.5); }
  .status-dot.error { background: #f87171; }

  .summary-bar { background: var(--white); border-bottom: 1px solid var(--border); padding: 14px 40px; display: flex; gap: 32px; flex-wrap: wrap; align-items: center; }
  .summary-stat { display: flex; align-items: center; gap: 8px; }
  .stat-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .stat-dot.empty { background: #cbd5e0; }
  .stat-dot.partial { background: var(--success-border); }
  .stat-label { font-size: 13px; color: var(--text-mid); }
  .stat-count { font-size: 13px; font-weight: 600; color: var(--text-dark); }

  .calendar-wrap { padding: 32px 40px; }
  .months-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }
  .month-card { background: var(--white); border-radius: var(--radius); border: 1px solid var(--border); box-shadow: var(--shadow); overflow: hidden; }
  .month-header { background: var(--navy); padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; }
  .month-name { font-size: 13px; font-weight: 600; color: var(--gold-light); letter-spacing: 0.08em; text-transform: uppercase; }
  .month-count { font-family: 'DM Mono', monospace; font-size: 11px; color: #7a93b0; }
  .month-body { padding: 10px; }
  .sat-slot { border-radius: 7px; padding: 9px 12px; margin-bottom: 6px; cursor: pointer; border: 1px solid var(--border); background: var(--white); transition: border-color 0.15s, transform 0.1s, box-shadow 0.15s; }
  .sat-slot:last-child { margin-bottom: 0; }
  .sat-slot:hover { border-color: #94a3b8; box-shadow: 0 2px 8px rgba(0,35,102,0.09); transform: translateY(-1px); }
  .sat-slot.has-signups { background: var(--success-bg); border-color: var(--success-border); }
  .sat-slot.has-signups .sat-date { color: var(--success-text); }
  .sat-date { font-size: 13px; font-weight: 600; color: var(--text-dark); margin-bottom: 3px; display: flex; align-items: center; justify-content: space-between; }
  .sat-badge { font-family: 'DM Mono', monospace; font-size: 10px; font-weight: 500; background: var(--navy); color: var(--gold-light); padding: 2px 6px; border-radius: 4px; }
  .sat-names { font-size: 11px; color: var(--success-text); line-height: 1.5; }
  .sat-empty { font-size: 11px; color: var(--text-light); }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,20,70,0.55); z-index: 200; align-items: center; justify-content: center; padding: 20px; }
  .modal-overlay.open { display: flex; }
  .modal { background: var(--white); border-radius: 14px; box-shadow: var(--shadow-lg); width: 100%; max-width: 400px; overflow: hidden; animation: modal-in 0.18s ease; }
  @keyframes modal-in { from { opacity: 0; transform: translateY(10px) scale(0.97); } to { opacity: 1; transform: translateY(0) scale(1); } }
  .modal-header { background: var(--navy); padding: 18px 22px; }
  .modal-label { font-size: 11px; color: var(--gold); font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 4px; }
  .modal-date-title { font-size: 20px; font-weight: 600; color: var(--white); }
  .modal-body { padding: 20px 22px; }
  .modal-section-label { font-size: 11px; font-weight: 600; color: var(--text-light); text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 8px; }
  .names-list { margin-bottom: 12px; }
  .name-row { display: flex; align-items: center; justify-content: space-between; padding: 8px 10px; background: var(--success-bg); border: 1px solid var(--success-border); border-radius: 7px; margin-bottom: 6px; font-size: 13px; color: var(--success-text); font-weight: 500; }
  .remove-btn { background: none; border: none; cursor: pointer; color: #a0aec0; font-size: 16px; line-height: 1; padding: 0 2px; transition: color 0.15s; }
  .remove-btn:hover { color: #e53e3e; }
  .remove-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .empty-state { font-size: 13px; color: var(--text-light); padding: 6px 0 12px; font-style: italic; }
  .saving-indicator { font-size: 12px; color: var(--text-light); font-style: italic; min-height: 18px; margin-bottom: 10px; }
  .input-row { display: flex; gap: 8px; margin-top: 4px; }
  .name-input { flex: 1; border: 1px solid var(--border); border-radius: 8px; padding: 9px 12px; font-size: 14px; font-family: 'DM Sans', sans-serif; color: var(--text-dark); outline: none; transition: border-color 0.15s; }
  .name-input:focus { border-color: var(--navy); }
  .name-input::placeholder { color: #a0aec0; }
  .add-btn { background: var(--navy); border: none; cursor: pointer; color: var(--gold-light); font-size: 13px; font-weight: 600; padding: 9px 16px; border-radius: 8px; font-family: 'DM Sans', sans-serif; transition: background 0.15s; white-space: nowrap; }
  .add-btn:hover { background: var(--navy-mid); }
  .add-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .modal-footer { padding: 14px 22px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; }
  .close-btn { background: none; border: 1px solid var(--border); cursor: pointer; color: var(--text-mid); font-size: 13px; font-weight: 500; padding: 8px 20px; border-radius: 8px; font-family: 'DM Sans', sans-serif; transition: background 0.15s; }
  .close-btn:hover { background: var(--cream); }

  @media (max-width: 600px) {
    .header, .summary-bar, .calendar-wrap, .status-bar { padding-left: 20px; padding-right: 20px; }
    .months-grid { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body>

<header class="header">
  <div class="header-left">
    <div class="logo-mark">WH</div>
    <div class="header-titles">
      <span class="brand">Window Hero</span>
      <span class="sub">Saturday Work Sign-Up Calendar</span>
    </div>
  </div>
  <div class="header-controls">
    <div class="year-nav">
      <button class="year-btn" onclick="changeYear(-1)">&#8592;</button>
      <span class="year-display" id="year-display">2026</span>
      <button class="year-btn" onclick="changeYear(1)">&#8594;</button>
    </div>
    <button class="icon-btn" id="refresh-btn" onclick="loadData(true)">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
      Refresh
    </button>
    <button class="icon-btn" onclick="exportCSV()">Export CSV</button>
  </div>
</header>

<div class="status-bar">
  <div class="status-dot" id="status-dot"></div>
  <span id="status-text">Connecting…</span>
</div>

<div class="summary-bar">
  <div class="summary-stat"><div class="stat-dot empty"></div><span class="stat-label">Open Saturdays</span><span class="stat-count" id="count-open">—</span></div>
  <div class="summary-stat"><div class="stat-dot partial"></div><span class="stat-label">Saturdays signed up</span><span class="stat-count" id="count-signed">—</span></div>
  <div class="summary-stat"><div class="stat-dot" style="background:var(--navy)"></div><span class="stat-label">Total sign-ups</span><span class="stat-count" id="count-total">—</span></div>
</div>

<div class="calendar-wrap">
  <div class="months-grid" id="months-grid"></div>
</div>

<div class="modal-overlay" id="modal-overlay" onclick="handleOverlayClick(event)">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-label">Saturday Sign-Up</div>
      <div class="modal-date-title" id="modal-date"></div>
    </div>
    <div class="modal-body">
      <div class="modal-section-label">Signed up</div>
      <div class="names-list" id="names-list"></div>
      <div class="saving-indicator" id="saving-indicator"></div>
      <div class="modal-section-label">Add your name</div>
      <div class="input-row">
        <input class="name-input" id="name-input" type="text" placeholder="First & last name" autocomplete="off" />
        <button class="add-btn" id="add-btn" onclick="addName()">Add</button>
      </div>
    </div>
    <div class="modal-footer">
      <button class="close-btn" onclick="closeModal()">Done</button>
    </div>
  </div>
</div>

<script>
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyozPSkEZgj1jtVoyRH-2XM0n3lFGixT9XjIna0sWVUPl1QGd04ulRR5c_UOf-CI8fV/exec';

  const MONTHS       = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const MONTHS_SHORT = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  let year      = new Date().getFullYear();
  let signups   = {};
  let activeKey = null;
  let busy      = false;

  function setStatus(state, text) {
    document.getElementById('status-dot').className = 'status-dot' + (state === 'live' ? ' live' : state === 'error' ? ' error' : '');
    document.getElementById('status-text').textContent = text;
  }

  function setSaving(text) {
    const el = document.getElementById('saving-indicator');
    if (el) el.textContent = text;
  }

  async function api(payload) {
    const res = await fetch(SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify(payload)
    });
    return res.json();
  }

  async function loadData(showSpin = false) {
    if (showSpin) {
      const btn = document.getElementById('refresh-btn');
      btn.classList.add('spinning');
      setTimeout(() => btn.classList.remove('spinning'), 500);
    }
    setStatus('', 'Loading…');
    try {
      const res = await api({ action: 'load' });
      if (res.success) {
        signups = res.data || {};
        setStatus('live', 'Live — last updated ' + new Date().toLocaleTimeString());
        renderCalendar();
      } else {
        throw new Error(res.error);
      }
    } catch(e) {
      setStatus('error', 'Could not connect — check your connection and refresh');
      renderCalendar();
    }
  }

  function getSaturdays(y) {
    const out = [], d = new Date(y, 0, 1);
    while (d.getDay() !== 6) d.setDate(d.getDate() + 1);
    while (d.getFullYear() === y) { out.push(new Date(d)); d.setDate(d.getDate() + 7); }
    return out;
  }

  function fmtKey(d) { return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  function fmtDisplay(d) { return MONTHS[d.getMonth()]+' '+d.getDate()+', '+d.getFullYear(); }
  function fmtShort(d) { return MONTHS_SHORT[d.getMonth()]+' '+d.getDate(); }

  function updateSummary(saturdays) {
    let open=0, signed=0, total=0;
    saturdays.forEach(s => { const n=signups[fmtKey(s)]||[]; if(!n.length) open++; else signed++; total+=n.length; });
    document.getElementById('count-open').textContent   = open;
    document.getElementById('count-signed').textContent = signed;
    document.getElementById('count-total').textContent  = total;
  }

  function renderCalendar() {
    document.getElementById('year-display').textContent = year;
    const saturdays = getSaturdays(year);
    updateSummary(saturdays);
    const grouped = {};
    saturdays.forEach(d => { const m=d.getMonth(); if(!grouped[m]) grouped[m]=[]; grouped[m].push(d); });
    const grid = document.getElementById('months-grid');
    grid.innerHTML = '';
    Object.keys(grouped).forEach(m => {
      const sats   = grouped[m];
      const filled = sats.filter(s => (signups[fmtKey(s)]||[]).length > 0).length;
      const card   = document.createElement('div'); card.className = 'month-card';
      const mh     = document.createElement('div'); mh.className = 'month-header';
      mh.innerHTML = `<span class="month-name">${MONTHS_SHORT[m]}</span><span class="month-count">${filled}/${sats.length}</span>`;
      card.appendChild(mh);
      const mb = document.createElement('div'); mb.className = 'month-body';
      sats.forEach(sat => {
        const key = fmtKey(sat), names = signups[key]||[];
        const slot = document.createElement('div');
        slot.className = 'sat-slot' + (names.length ? ' has-signups' : '');
        slot.onclick = () => openModal(key, sat);
        const dr = document.createElement('div'); dr.className = 'sat-date';
        dr.innerHTML = `<span>${fmtShort(sat)}</span>` + (names.length ? `<span class="sat-badge">${names.length}</span>` : '');
        slot.appendChild(dr);
        const sub = document.createElement('div');
        if (names.length) { sub.className='sat-names'; sub.textContent=names.join(', '); }
        else { sub.className='sat-empty'; sub.textContent='tap to sign up'; }
        slot.appendChild(sub);
        mb.appendChild(slot);
      });
      card.appendChild(mb); grid.appendChild(card);
    });
  }

  function changeYear(d) { year += d; renderCalendar(); }

  function openModal(key, dateObj) {
    activeKey = key;
    document.getElementById('modal-date').textContent = fmtDisplay(dateObj);
    setSaving('');
    refreshModalList();
    document.getElementById('modal-overlay').classList.add('open');
    setTimeout(() => document.getElementById('name-input').focus(), 80);
  }

  function refreshModalList() {
    const names = signups[activeKey]||[], list = document.getElementById('names-list');
    list.innerHTML = '';
    if (!names.length) { list.innerHTML = '<div class="empty-state">No one signed up yet — be the first!</div>'; return; }
    names.forEach((n, i) => {
      const row = document.createElement('div'); row.className = 'name-row';
      row.innerHTML = `<span>${n}</span><button class="remove-btn" onclick="removeName('${n.replace(/'/g,"\\'")}')">&#x2715;</button>`;
      list.appendChild(row);
    });
  }

  async function addName() {
    const input = document.getElementById('name-input'), name = input.value.trim();
    if (!name || busy) return;
    if ((signups[activeKey]||[]).includes(name)) { input.value=''; return; }
    busy = true;
    document.getElementById('add-btn').disabled = true;
    setSaving('Saving…');
    if (!signups[activeKey]) signups[activeKey] = [];
    signups[activeKey].push(name);
    input.value = '';
    refreshModalList();
    renderCalendar();
    try {
      await api({ action: 'add', date: activeKey, name });
      setSaving('Saved ✓');
      setTimeout(() => setSaving(''), 2000);
      setStatus('live', 'Live — last updated ' + new Date().toLocaleTimeString());
    } catch(e) {
      setSaving('Save failed — try again');
      signups[activeKey].splice(signups[activeKey].indexOf(name), 1);
      refreshModalList();
      renderCalendar();
    }
    busy = false;
    document.getElementById('add-btn').disabled = false;
  }

  async function removeName(name) {
    if (busy || !activeKey) return;
    busy = true;
    setSaving('Removing…');
    signups[activeKey] = (signups[activeKey]||[]).filter(n => n !== name);
    if (!signups[activeKey].length) delete signups[activeKey];
    refreshModalList();
    renderCalendar();
    try {
      await api({ action: 'remove', date: activeKey, name });
      setSaving('Removed ✓');
      setTimeout(() => setSaving(''), 2000);
      setStatus('live', 'Live — last updated ' + new Date().toLocaleTimeString());
    } catch(e) {
      setSaving('Remove failed — try refreshing');
    }
    busy = false;
  }

  function closeModal() { document.getElementById('modal-overlay').classList.remove('open'); activeKey = null; }
  function handleOverlayClick(e) { if (e.target===document.getElementById('modal-overlay')) closeModal(); }

  function exportCSV() {
    const saturdays = getSaturdays(year);
    const rows = [['Date','Day of Week','Names','Headcount']];
    saturdays.forEach(s => { const k=fmtKey(s), n=signups[k]||[]; rows.push([fmtDisplay(s),'Saturday',n.join('; '),n.length]); });
    const csv  = rows.map(r => r.map(v => '"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');
    const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
    const url  = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = 'wh-saturday-signups-'+year+'.csv'; a.click(); URL.revokeObjectURL(url);
  }

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeModal();
    if (e.key === 'Enter' && activeKey && !busy) addName();
  });

  // Auto-refresh every 30 seconds
  setInterval(() => { if (!busy) loadData(false); }, 30000);

  loadData();
</script>
</body>
</html>
